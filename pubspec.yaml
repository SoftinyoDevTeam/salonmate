name: salonmate
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.1.6+216

environment:
  sdk: '>=3.2.3 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.2
  easy_localization: ^3.0.3 # flutter pub run easy_localization:generate --source-dir assets/translations --output-dir lib/core/langs/   
  flutter_screenutil: ^5.9.0
  dio: ^5.4.0
  flutter_widget_from_html: ^0.15.2
  fluttertoast: ^8.2.4
  shared_preferences: ^2.2.2
  animated_bottom_navigation_bar: ^1.3.3
  shake_detector: ^0.1.2
  pinput: ^5.0.0
  web_socket_client: ^0.1.4
  icons_launcher: ^3.0.0 #dart run icons_launcher:create
  share_plus: ^10.1.1
  syncfusion_flutter_datepicker: ^27.1.57
  flutter_credit_card: ^4.0.1
  cached_network_image: ^3.3.1
  objectbox: ^4.0.3
  firebase_core: ^3.7.0   #dart pub global activate flutterfire_cli
  firebase_messaging: ^15.1.4
  flutter_local_notifications: ^17.0.0
  five_pointed_star: ^1.0.3
  dart_eval: ^0.7.9
  path_provider: ^2.1.2
  overlay_tooltip: ^0.2.3
  webviewx_plus: ^0.5.0
  font_awesome_flutter: ^10.7.0
  vibration: ^2.0.1
  search_field_autocomplete: ^1.0.0 
  ios_keyboard_action: ^0.0.2
  webview_flutter: ^4.8.0
  easy_url_launcher: ^0.0.7
  rename_app: ^1.6.1 #dart run rename_app:main android="Anroid Name" ios="IOS Name" others="Others Name"
  provider: ^6.1.2
  phone_numbers_parser: ^9.0.3
  circle_flags: ^5.0.0
  flutter_country_selector: ^1.0.14

dev_dependencies:
  flutter_test:
    sdk: flutter 

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  change_app_package_name: ^1.3.0 #dart run change_app_package_name:main com.new.package.name
  

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  fonts:
    # For details regarding fonts from package dependencies,
    # see https://flutter.dev/custom-fonts/#from-packages
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat/Montserrat-Thin.ttf
          weight: 100
        - asset: assets/fonts/Montserrat/Montserrat-ThinItalic.ttf
          style: italic
          weight: 100
        - asset: assets/fonts/Montserrat/Montserrat-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Montserrat/Montserrat-ExtraLightItalic.ttf
          style: italic
          weight: 200
        - asset: assets/fonts/Montserrat/Montserrat-Light.ttf
          weight: 300
        - asset: assets/fonts/Montserrat/Montserrat-LightItalic.ttf
          style: italic
          weight: 300
        - asset: assets/fonts/Montserrat/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat/Montserrat-MediumItalic.ttf
          style: italic
          weight: 500
        - asset: assets/fonts/Montserrat/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat/Montserrat-SemiBoldItalic.ttf
          style: italic
          weight: 600
        - asset: assets/fonts/Montserrat/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat/Montserrat-BoldItalic.ttf
          style: italic
          weight: 700
        - asset: assets/fonts/Montserrat/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Montserrat/Montserrat-ExtraBoldItalic.ttf
          style: italic
          weight: 800
        - asset: assets/fonts/Montserrat/Montserrat-Black.ttf
          weight: 900
        - asset: assets/fonts/Montserrat/Montserrat-BlackItalic.ttf
          style: italic
          weight: 900
    # w100 Thin, the least thick
    # w200 Extra-light
    # w300 Light
    # w400 Normal / regular / plain
    # w500 Medium
    # w600 Semi-bold
    # w700 Bold
    # w800 Extra-bold
    # w900 Black, the most thick
  assets:
    - assets/translations/
    - assets/images/
    - assets/images/icons/
    - assets/images/splash/
    - assets/images/backgrounds/
    - assets/appicon/